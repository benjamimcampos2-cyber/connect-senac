<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Senac - Criar Conta</title>
    <link rel="stylesheet" href="css/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="min-h-full py-10 px-4 sm:px-6 lg:px-8 flex items-center justify-center">

    <div class="w-full max-w-2xl">
        <!-- Logo / Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-brand-600 shadow-lg shadow-brand-600/30 text-white text-xl font-bold mb-3">
                CS
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Criar Nova Conta</h1>
            <p class="text-sm text-slate-500 mt-1">Preencha os seus dados para agendar atendimentos práticos</p>
        </div>

        <!-- Card de Cadastro -->
        <div class="bg-white rounded-3xl p-6 sm:p-10 shadow-xl shadow-slate-200/60 border border-slate-100">
            <form id="formCadastro" class="space-y-6">
                <!-- Nome Completo -->
                <div>
                    <label for="nome" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Ex: Maria Silva Santos" required
                        class="w-full rounded-xl border border-slate-200 bg-slate-50/50 px-4 py-3 text-sm text-slate-800 transition focus:bg-white focus:border-brand-600 focus:outline-none focus:ring-4 focus:ring-brand-600/10">
                </div>

                <!-- Grid E-mail & Telefone -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                    <div>
                        <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">E-mail</label>
                        <input type="email" id="email" placeholder="seu.email@exemplo.com" required
                            class="w-full rounded-xl border border-slate-200 bg-slate-50/50 px-4 py-3 text-sm text-slate-800 transition focus:bg-white focus:border-brand-600 focus:outline-none focus:ring-4 focus:ring-brand-600/10">
                    </div>
                    <div>
                        <label for="telefone" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Telefone (WhatsApp)</label>
                        <input type="tel" id="telefone" placeholder="(75) 99999-9999" required
                            class="w-full rounded-xl border border-slate-200 bg-slate-50/50 px-4 py-3 text-sm text-slate-800 transition focus:bg-white focus:border-brand-600 focus:outline-none focus:ring-4 focus:ring-brand-600/10">
                    </div>
                </div>

                <!-- Grid Senhas -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                    <div>
                        <label for="senha" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Palavra-passe</label>
                        <input type="password" id="senha" placeholder="••••••••" required
                            class="w-full rounded-xl border border-slate-200 bg-slate-50/50 px-4 py-3 text-sm text-slate-800 transition focus:bg-white focus:border-brand-600 focus:outline-none focus:ring-4 focus:ring-brand-600/10">
                    </div>
                    <div>
                        <label for="confirmar_senha" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Confirmar Palavra-passe</label>
                        <input type="password" id="confirmar_senha" placeholder="••••••••" required
                            class="w-full rounded-xl border border-slate-200 bg-slate-50/50 px-4 py-3 text-sm text-slate-800 transition focus:bg-white focus:border-brand-600 focus:outline-none focus:ring-4 focus:ring-brand-600/10">
                    </div>
                </div>

                <!-- Box LGPD -->
                <div class="rounded-2xl bg-slate-50 p-5 border border-slate-200/80 space-y-3.5">
                    <div class="flex items-center gap-2">
                        <span class="text-base">🛡️</span>
                        <h3 class="text-xs font-bold text-slate-800 uppercase tracking-wider">Privacidade e Termos (LGPD)</h3>
                    </div>
                    
                    <label class="flex items-start gap-3 cursor-pointer">
                        <input type="checkbox" id="termoUso" required
                            class="mt-0.5 h-4 w-4 rounded border-slate-300 text-brand-600 focus:ring-brand-600/20">
                        <span class="text-xs text-slate-600 leading-relaxed">
                            Li e aceito os <a href="#" class="text-brand-600 hover:text-brand-800 underline font-semibold">Termos de Uso</a> e a <a href="#" class="text-brand-600 hover:text-brand-800 underline font-semibold">Política de Privacidade</a>.*
                        </span>
                    </label>

                    <label class="flex items-start gap-3 cursor-pointer">
                        <input type="checkbox" id="termoImagem"
                            class="mt-0.5 h-4 w-4 rounded border-slate-300 text-brand-600 focus:ring-brand-600/20">
                        <span class="text-xs text-slate-500 leading-relaxed">
                            Autorizo o uso de imagens dos procedimentos realizados para o portfólio académico da turma (Opcional).
                        </span>
                    </label>
                </div>

                <div id="mensagemCadastro" class="text-center text-xs font-semibold"></div>

                <button type="submit" class="w-full inline-flex items-center justify-center rounded-xl bg-brand-600 py-3.5 px-4 text-sm font-bold text-white shadow-lg shadow-brand-600/25 hover:bg-brand-800 focus:outline-none focus:ring-4 focus:ring-brand-600/20 active:scale-[0.99] transition-all">
                    Finalizar Registo
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                <p class="text-sm text-slate-500">
                    Já tem uma conta? 
                    <a href="index.html" class="font-bold text-brand-600 hover:text-brand-800 hover:underline transition">Faça Login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
