<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Senac - Criar Conta</title>
    <link rel="stylesheet" href="css/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="min-h-full py-10 px-4 sm:px-6 lg:px-8 flex items-center justify-center bg-gradient-to-br from-slate-50 via-brand-50/30 to-slate-100 antialiased">

    <main class="w-full max-w-2xl my-auto">
        <!-- Logo / Cabeçalho -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-700 to-brand-500 shadow-soft-xl text-white text-xl font-black mb-3 ring-4 ring-white">
                CS
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Criar Conta no Connect Senac</h1>
            <p class="text-sm text-slate-500 mt-1">Preencha seus dados para ser voluntário(a) e agendar atendimentos</p>
        </div>

        <!-- Card de Cadastro -->
        <div class="bg-white/95 backdrop-blur-sm rounded-3xl p-6 sm:p-10 shadow-soft-xl border border-slate-200/80">
            <form id="formCadastro" class="space-y-6" novalidate>
                
                <!-- Bloco 1: Dados Pessoais -->
                <div class="space-y-4">
                    <div class="flex items-center gap-2 pb-2 border-b border-slate-100 text-xs font-bold uppercase tracking-wider text-brand-600">
                        <span>👤</span>
                        <span>Dados de Identificação</span>
                    </div>

                    <!-- Nome Completo -->
                    <div>
                        <label for="nome" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Nome Completo</label>
                        <input type="text" id="nome" placeholder="Ex: Maria Silva Santos" required autocomplete="name"
                            class="w-full rounded-xl border border-slate-200 bg-slate-50/60 px-4 py-3 text-sm text-slate-800 transition focus:bg-white focus:border-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-600 focus:ring-offset-1">
                    </div>

                    <!-- Grid E-mail & Telefone -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                        <div>
                            <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">E-mail</label>
                            <input type="email" id="email" placeholder="seu.email@exemplo.com" required autocomplete="email"
                                class="w-full rounded-xl border border-slate-200 bg-slate-50/60 px-4 py-3 text-sm text-slate-800 transition focus:bg-white focus:border-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-600 focus:ring-offset-1">
                        </div>
                        <div>
                            <label for="telefone" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">WhatsApp / Telefone</label>
                            <input type="tel" id="telefone" placeholder="(75) 99999-9999" required autocomplete="tel"
                                class="w-full rounded-xl border border-slate-200 bg-slate-50/60 px-4 py-3 text-sm text-slate-800 transition focus:bg-white focus:border-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-600 focus:ring-offset-1">
                        </div>
                    </div>
                </div>

                <!-- Bloco 2: Segurança -->
                <div class="space-y-4 pt-2">
                    <div class="flex items-center gap-2 pb-2 border-b border-slate-100 text-xs font-bold uppercase tracking-wider text-brand-600">
                        <span>🔒</span>
                        <span>Segurança da Conta</span>
                    </div>

                    <!-- Grid Senhas -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                        <div>
                            <label for="senha" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Criar Senha</label>
                            <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required autocomplete="new-password"
                                class="w-full rounded-xl border border-slate-200 bg-slate-50/60 px-4 py-3 text-sm text-slate-800 transition focus:bg-white focus:border-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-600 focus:ring-offset-1">
                        </div>
                        <div>
                            <label for="confirmar_senha" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Confirmar Senha</label>
                            <input type="password" id="confirmar_senha" placeholder="Repita sua senha" required autocomplete="new-password"
                                class="w-full rounded-xl border border-slate-200 bg-slate-50/60 px-4 py-3 text-sm text-slate-800 transition focus:bg-white focus:border-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-600 focus:ring-offset-1">
                        </div>
                    </div>
                </div>

                <!-- Bloco 3: Box LGPD -->
                <div class="rounded-2xl bg-slate-50/80 p-5 border border-slate-200 space-y-4">
                    <div class="flex items-center gap-2">
                        <span class="text-base text-brand-600">🛡️</span>
                        <h3 class="text-xs font-bold text-slate-800 uppercase tracking-wider">Privacidade e Termos (LGPD)</h3>
                    </div>
                    
                    <label class="flex items-start gap-3 cursor-pointer select-none">
                        <input type="checkbox" id="termoUso" required
                            class="mt-1 h-4 w-4 rounded border-slate-300 text-brand-600 focus:ring-brand-600 focus:ring-offset-1">
                        <span class="text-xs text-slate-600 leading-relaxed">
                            Li e aceito os <a href="#" class="text-brand-600 hover:text-brand-800 underline font-semibold">Termos de Uso</a> e a <a href="#" class="text-brand-600 hover:text-brand-800 underline font-semibold">Política de Privacidade</a> do Senac.*
                        </span>
                    </label>

                    <label class="flex items-start gap-3 cursor-pointer select-none">
                        <input type="checkbox" id="termoImagem"
                            class="mt-1 h-4 w-4 rounded border-slate-300 text-brand-600 focus:ring-brand-600 focus:ring-offset-1">
                        <span class="text-xs text-slate-500 leading-relaxed">
                            Autorizo o uso pedagógico de imagens dos procedimentos realizados para portfólio acadêmico da turma (Opcional).
                        </span>
                    </label>
                </div>

                <div id="mensagemCadastro" role="alert" aria-live="polite" class="text-center text-xs font-semibold"></div>

                <button type="submit" id="btnSubmit" class="btn-brand w-full py-4 text-sm font-bold shadow-soft-md">
                    Concluir Cadastro
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                <p class="text-sm text-slate-500">
                    Já possui cadastro? 
                    <a href="index.html" class="font-bold text-brand-600 hover:text-brand-800 hover:underline transition">Acesse sua conta</a>
                </p>
            </div>
        </div>
        
        <footer class="text-center text-xs text-slate-400 mt-6">
            &copy; 2026 Connect Senac - Todos os direitos reservados.
        </footer>
    </main>

    <script src="js/toast.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
