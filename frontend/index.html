<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Senac - Login</title>
    <link rel="stylesheet" href="css/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4 sm:p-6 lg:p-8">

    <div class="w-full max-w-md">
        <!-- Logo / Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-brand-600 shadow-lg shadow-brand-600/30 text-white text-2xl font-bold mb-4">
                CS
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Connect Senac</h1>
            <p class="text-sm text-slate-500 mt-1.5">Insira as suas credenciais para aceder ao sistema</p>
        </div>

        <!-- Card de Login -->
        <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-xl shadow-slate-200/60 border border-slate-100">
            <form id="formLogin" class="space-y-5">
                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">E-mail institucional ou pessoal</label>
                    <div class="relative">
                        <input type="email" id="email" placeholder="seu.email@exemplo.com" required
                            class="w-full rounded-xl border border-slate-200 bg-slate-50/50 px-4 py-3 text-sm text-slate-800 transition focus:bg-white focus:border-brand-600 focus:outline-none focus:ring-4 focus:ring-brand-600/10">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="senha" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Palavra-passe</label>
                        <a href="esqueci-senha.html" class="text-xs font-semibold text-brand-600 hover:text-brand-800 transition">Esqueceu a senha?</a>
                    </div>
                    <div class="relative">
                        <input type="password" id="senha" placeholder="••••••••" required
                            class="w-full rounded-xl border border-slate-200 bg-slate-50/50 px-4 py-3 text-sm text-slate-800 transition focus:bg-white focus:border-brand-600 focus:outline-none focus:ring-4 focus:ring-brand-600/10">
                    </div>
                </div>

                <div id="mensagemErro" class="hidden rounded-xl bg-rose-50 border border-rose-200 p-3.5 text-xs font-medium text-rose-700"></div>

                <button type="submit" class="w-full inline-flex items-center justify-center rounded-xl bg-brand-600 py-3.5 px-4 text-sm font-bold text-white shadow-lg shadow-brand-600/25 hover:bg-brand-800 focus:outline-none focus:ring-4 focus:ring-brand-600/20 active:scale-[0.99] transition-all">
                    Entrar na Plataforma
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                <p class="text-sm text-slate-500">
                    Ainda não tem uma conta? 
                    <a href="cadastro.html" class="font-bold text-brand-600 hover:text-brand-800 hover:underline transition">Registe-se aqui</a>
                </p>
            </div>
        </div>

        <p class="text-center text-xs text-slate-400 mt-6">
            &copy; 2026 Connect Senac - Todos os direitos reservados.
        </p>
    </div>

    <script src="js/toast.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
