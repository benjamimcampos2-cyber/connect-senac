<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Senac - Painel do Docente</title>
    <link rel="stylesheet" href="css/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="min-h-full flex flex-col bg-slate-50 text-slate-800">

    <!-- Navbar Moderna -->
    <header class="sticky top-0 z-40 bg-brand-600 text-white shadow-md shadow-brand-900/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 sm:h-20">
                <div class="flex items-center gap-3">
                    <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-white/10 text-white font-bold text-lg backdrop-blur-sm border border-white/20">
                        CS
                    </div>
                    <div>
                        <a href="#" class="font-extrabold text-lg sm:text-xl tracking-tight text-white">Connect Senac</a>
                        <span class="hidden sm:inline-block ml-2 text-xs font-semibold px-2.5 py-0.5 rounded-full bg-white/15 text-white">Área do Professor</span>
                    </div>
                </div>

                <div class="flex items-center gap-2 sm:gap-3">
                    <a href="painel.html" class="inline-flex items-center gap-1.5 rounded-xl bg-amber-400/20 hover:bg-amber-400/30 text-amber-200 border border-amber-400/30 text-xs sm:text-sm font-bold px-3 py-2 transition active:scale-95">
                        👁️ <span class="hidden sm:inline">Ver Visão do Modelo</span>
                    </a>
                    <button id="btnSair" class="inline-flex items-center justify-center rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs sm:text-sm font-semibold px-3.5 py-2 border border-white/20 transition active:scale-95">
                        Sair
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 mb-8 pb-4 border-b border-slate-200">
            <div class="flex items-center gap-3">
                <span class="p-2.5 rounded-2xl bg-brand-50 text-brand-600 text-xl">👨‍🏫</span>
                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight">As Minhas Turmas e Listas de Presença</h1>
                    <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Gerencie a frequência e contatos dos modelos agendados</p>
                </div>
            </div>
            <div class="inline-flex items-center gap-2 self-start sm:self-auto px-3.5 py-1.5 rounded-xl bg-white border border-slate-200 shadow-xs text-xs font-medium text-slate-600">
                <span>Professor:</span>
                <strong id="nomeProf" class="text-slate-900 font-bold">--</strong>
            </div>
        </div>

        <!-- Acordeão de Turmas com Skeletons -->
        <div id="accordionTurmas" class="space-y-4">
            <div class="bg-white rounded-3xl border border-slate-200 p-6 space-y-4 animate-pulse">
                <div class="h-5 bg-slate-200 rounded-md w-1/3"></div>
                <div class="h-3 bg-slate-100 rounded-md w-2/3"></div>
            </div>
            <div class="bg-white rounded-3xl border border-slate-200 p-6 space-y-4 animate-pulse">
                <div class="h-5 bg-slate-200 rounded-md w-1/3"></div>
                <div class="h-3 bg-slate-100 rounded-md w-2/3"></div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS Bundle para suporte funcional a acordeões -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utils/sanitize.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/profissional.js"></script>
</body>
</html>
