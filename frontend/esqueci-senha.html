<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Senac - Recuperar Acesso</title>
    <link rel="stylesheet" href="css/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="min-h-full flex items-center justify-center p-4 sm:p-6 lg:p-8 bg-gradient-to-br from-slate-50 via-brand-50/30 to-slate-100 antialiased">

    <main class="w-full max-w-md my-auto">
        <!-- Logo / Cabeçalho -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-700 to-brand-500 shadow-soft-xl text-white text-xl font-black mb-3 ring-4 ring-white">
                CS
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Recuperar Acesso</h1>
            <p class="text-sm text-slate-500 mt-1">Insira seu e-mail cadastrado para receber o link de recuperação</p>
        </div>

        <!-- Card de Recuperação -->
        <div class="bg-white/95 backdrop-blur-sm rounded-3xl p-6 sm:p-8 shadow-soft-xl border border-slate-200/80">
            <form id="formEsqueci" class="space-y-5" novalidate>
                <div>
                    <label for="emailRecuperacao" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Seu E-mail Cadastrado</label>
                    <input type="email" id="emailRecuperacao" placeholder="seu.email@exemplo.com" required autocomplete="email"
                        class="w-full rounded-xl border border-slate-200 bg-slate-50/60 px-4 py-3 text-sm text-slate-800 transition focus:bg-white focus:border-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-600 focus:ring-offset-1">
                </div>

                <div id="msgRecuperacao" role="alert" aria-live="polite" class="text-center text-xs font-semibold"></div>

                <button type="submit" id="btnSubmitRecuperacao" class="btn-brand w-full py-3.5 text-sm font-bold shadow-soft-md">
                    Enviar Instruções de Recuperação
                </button>

                <a href="index.html" class="btn-secondary w-full py-3 text-sm font-semibold">
                    ← Voltar para o Login
                </a>
            </form>
        </div>

        <footer class="text-center text-xs text-slate-400 mt-6">
            &copy; 2026 Connect Senac - Todos os direitos reservados.
        </footer>
    </main>

    <script src="js/toast.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
