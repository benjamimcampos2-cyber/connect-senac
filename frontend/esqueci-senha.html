<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Senac - Recuperar Acesso</title>
    <link rel="stylesheet" href="css/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4 sm:p-6 lg:p-8">

    <div class="w-full max-w-md">
        <!-- Logo / Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-brand-600 shadow-lg shadow-brand-600/30 text-white text-xl font-bold mb-3">
                CS
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Recuperar Acesso</h1>
            <p class="text-sm text-slate-500 mt-1">Insira o seu e-mail para receber as instruções de recuperação</p>
        </div>

        <!-- Card de Recuperação -->
        <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-xl shadow-slate-200/60 border border-slate-100">
            <form id="formEsqueci" class="space-y-5">
                <div>
                    <label for="emailRecuperacao" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">O seu E-mail</label>
                    <input type="email" id="emailRecuperacao" placeholder="seu.email@exemplo.com" required
                        class="w-full rounded-xl border border-slate-200 bg-slate-50/50 px-4 py-3 text-sm text-slate-800 transition focus:bg-white focus:border-brand-600 focus:outline-none focus:ring-4 focus:ring-brand-600/10">
                </div>

                <div id="msgRecuperacao" class="text-center text-xs font-semibold"></div>

                <button type="submit" class="w-full inline-flex items-center justify-center rounded-xl bg-brand-600 py-3.5 px-4 text-sm font-bold text-white shadow-lg shadow-brand-600/25 hover:bg-brand-800 focus:outline-none focus:ring-4 focus:ring-brand-600/20 active:scale-[0.99] transition-all">
                    Enviar Link de Recuperação
                </button>

                <a href="index.html" class="w-full inline-flex items-center justify-center rounded-xl bg-slate-100 py-3 px-4 text-sm font-semibold text-slate-700 hover:bg-slate-200 transition">
                    Voltar ao Login
                </a>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
